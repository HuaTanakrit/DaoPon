services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football_dev}
      POSTGRES_DB: premier_league
    volumes:
      - football_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d premier_league"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  football_postgres:
